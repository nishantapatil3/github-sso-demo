[project]
name = "sample-sso-backend"
version = "0.1.0"
description = "Sample GitHub OAuth App SSO backend (FastAPI)"
requires-python = ">=3.11,<4"
dependencies = ["fastapi (>=0.142.2,<0.143.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "httpx (>=0.28.1,<0.29.0)", "pyjwt (>=2.15.1,<3.0.0)", "pydantic-settings (>=2.15.0,<3.0.0)"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "respx (>=0.23.1,<0.24.0)"
]
